<style>
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; background: #050913; overflow-x: hidden; }
  body { font-family: "Sora", system-ui, sans-serif; color: #fff; }
  #root { width: 100%; min-height: 100vh; }

  /* ── MOBILE HERO + MENU FIXES ── */
  @media (hover: none) and (pointer: coarse) {
    html body .dirA .hero-sec .eyebrow { display: none !important; }
    html body .dirA .hero-head nav { display: none !important; }
    html body .dirA .hero-head .lang-toggle,
    html body .dirA .hero-head .mono { display: none !important; }
    html body .dirA .hero-head .container { padding-left: 18px !important; padding-right: 18px !important; }
    html body .dirA .hero-head .container > div:last-child { margin-right: 0 !important; flex: 0 0 auto !important; }
    html body .dirA .hero-head .container > div:first-child { gap: 4px !important; min-width: 0 !important; }
    html body .dirA .hero-head .container > div:first-child > svg { width: 28px !important; height: 33px !important; margin-right: -3px !important; }
    html body .dirA .hero-head .rt-wordmark { display: flex !important; }
    html body .dirA .hero-head .rt-wordmark .rt-tag { display: none !important; }
    html body .dirA .hero-head .rt-wordmark .rt-word { font-size: 19px !important; letter-spacing: 0.14em !important; font-weight: 300 !important; }
    html body .dirA .hero-head .rt-word .ch { opacity: 1 !important; transform: none !important; animation: none !important; }
    html body .dirA [role="dialog"][aria-modal="true"] { overflow-y: auto !important; }
    html body .dirA [role="dialog"] > header { padding-top: 16px !important; padding-bottom: 0 !important; }
    html body .dirA [role="dialog"] > header .container { min-height: 0 !important; }
    html body .dirA .menu-grid { padding-top: 28px !important; }
    html body .dirA [role="dialog"] [aria-hidden="true"] > div { animation: none !important; }
    html body .dirA .scroll-bar .container > a > span { display: inline-block !important; font-size: 16px !important; letter-spacing: 0.2em !important; }
    html body .dirA .scroll-bar .rt-word .ch { opacity: 1 !important; transform: none !important; animation: none !important; }
  }
  @media (max-width: 768px) {
