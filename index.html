<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reality Tunnel — Immersive Experiences Studio</title>
<meta name="description" content="Unforgettable AR, VR + 3D experiences that move the metric.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap">

<style>
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; background: #050913; overflow-x: hidden; }
  body { font-family: "Sora", system-ui, sans-serif; color: #fff; }
  #root { width: 100%; min-height: 100vh; }

  /* ── MOBILE HERO FIXES (live here in index.html so they always deploy) ──
     High specificity (html body .dirA…) + !important guarantees these win
     over the component's own injected styles regardless of source order.
     The touch-device query fires on EVERY phone in ANY orientation — it does
     not depend on the 768px width breakpoint, which an iPhone Pro Max defeats
     in landscape (926px wide) and which page-zoom can defeat in portrait. */
  @media (hover: none) and (pointer: coarse) {
    html body .dirA .hero-eyebrow { display: none !important; }
    html body .dirA .hero-head nav { display: none !important; }
    html body .dirA .hero-head .lang-toggle { display: none !important; }
    html body .dirA .hero-head .hero-lockup { gap: 9px !important; }
    html body .dirA .hero-head .hero-lockup > svg { width: 52px !important; height: 62px !important; }
    html body .dirA .hero-head .rt-wordmark .rt-word { font-size: 15px !important; letter-spacing: 0.18em !important; }
    html body .dirA .hero-head .rt-wordmark .rt-tag { font-size: 8px !important; letter-spacing: 0.34em !important; }
  }
  /* Narrow desktop windows (no touch) — same treatment via width. */
  @media (max-width: 768px) {
    html body .dirA .hero-eyebrow { display: none !important; }
    html body .dirA .hero-head nav { display: none !important; }
    html body .dirA .hero-head .lang-toggle { display: none !important; }
    html body .dirA .hero-head .hero-lockup { gap: 9px !important; }
    html body .dirA .hero-head .hero-lockup > svg { width: 52px !important; height: 62px !important; }
    html body .dirA .hero-head .rt-wordmark .rt-word { font-size: 15px !important; letter-spacing: 0.18em !important; }
    html body .dirA .hero-head .rt-wordmark .rt-tag { font-size: 8px !important; letter-spacing: 0.34em !important; }
  }
</style>
</head>
<body>

<div id="root"></div>

<!-- Production React (small + fast). JSX is precompiled to plain JS in build/ so
     mobile Safari never has to run Babel at runtime — that runtime transpile of
     ~200KB of JSX was what crashed iPhones ("Can't open this page").
     To change components: edit the .jsx source, then rebuild build/*.js. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<script src="build/tweaks-panel.js?v=3"></script>
<script src="build/shared.js?v=3"></script>
<script src="build/i18n.js?v=3"></script>
<script src="build/direction-a.js?v=3"></script>
<script src="build/app.js?v=3"></script>

</body>
</html>
