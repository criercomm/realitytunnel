  var base = (origin + window.location.pathname).replace(/[^/]+$/, '');

    var v = m.getAttribute('content');
    if (v && v.indexOf(ph + '/') === 0) m.setAttribute('content', v.replace(ph + '/', base));

    s.textContent = s.textContent.split(ph + '/').join(base);
