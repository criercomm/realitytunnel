<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="canonical" href="https://realitytunnel.ai/hp-ar.html">
<script>
(function(){
  var c = document.querySelector('link[rel="canonical"]');
  if (c) c.href = window.location.origin + window.location.pathname;
  var ph = 'https://realitytunnel.ai';
  var origin = window.location.origin;
  if (origin === ph) return;
  var base = (origin + window.location.pathname).replace(/[^/]+$/, '');
  [].forEach.call(document.querySelectorAll('meta[content]'), function(m) {
    var v = m.getAttribute('content');
    if (v && v.indexOf(ph + '/') === 0) m.setAttribute('content', v.replace(ph + '/', base));
  });
  [].forEach.call(document.querySelectorAll('script[type="application/ld+json"]'), function(s) {
    s.textContent = s.textContent.split(ph + '/').join(base);
  });
})();
</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Hewlett Packard AR — Reality Tunnel</title>
<meta name="description" content="Hewlett Packard AR — a Reality Tunnel project.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap">

<style>
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: "Sora", system-ui, sans-serif; color: #0a0a0a; }
  #root { width: 100%; min-height: 100vh; }
</style>
</head>
<body>

<div id="root"></div>

<script>window.RT_PROJECT_SLUG = "hp-ar";</script>

<!-- Production React + precompiled JS (build/) so mobile Safari never runs Babel
     at runtime. Edit the .jsx source and rebuild build/*.js to change components. -->
<script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
<script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>

<script defer src="build/shared.js"></script>
<script defer src="build/i18n.js"></script>
<script defer src="build/project-page.js"></script>

<script>window.addEventListener("load",function(){var l=document.createElement("link");l.rel="manifest";l.href="manifest.json";document.head.appendChild(l);});</script>
</body>
</html>
